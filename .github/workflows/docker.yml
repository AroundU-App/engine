# GitHub Actions workflow which builds and publishes the Docker image.

name: Build docker images

on:
  push:
    tags: ["engine-v1.26.*"]
    branches: [master, main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and push image for ${{ matrix.platform }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runs_on: ubuntu-24.04
            suffix: linux-amd64
          - platform: linux/arm64
            runs_on: ubuntu-24.04-arm
            suffix: linux-arm64
    steps:
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve release metadata
        shell: bash
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          image="${owner}/engine"
          if [[ -n "${{ secrets.DOCKERHUB_REPOSITORY }}" ]]; then
            image="${{ secrets.DOCKERHUB_REPOSITORY }}"
          fi
          echo "DOCKERHUB_IMAGE=${image}" >> "$GITHUB_ENV"
          if [[ "${GITHUB_REF}" == refs/tags/engine-v1.26.* ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^engine-v1\.26\.[0-9]+$ ]]; then
              echo "Release tag must match engine-v1.26.<sequence> (example: engine-v1.26.3)."
              exit 1
            fi
            git fetch --tags --force origin
            current_sequence="${GITHUB_REF_NAME##*.}"
            previous_sequence="$(git tag --list 'engine-v1.26.*' \
              | sed -E 's/^engine-v1\.26\.([0-9]+)$/\1/' \
              | grep -E '^[0-9]+$' \
              | awk -v cur="${current_sequence}" '$0 != cur' \
              | sort -n \
              | tail -n 1)"
            expected_sequence=1
            if [[ -n "${previous_sequence}" ]]; then
              expected_sequence=$((previous_sequence + 1))
            fi
            if [[ "${current_sequence}" != "${expected_sequence}" ]]; then
              echo "Release tags must increment by exactly +1. Expected engine-v1.26.${expected_sequence}, got ${GITHUB_REF_NAME}."
              exit 1
            fi
            echo "ENGINE_VERSION=${GITHUB_REF_NAME#engine-v}" >> "$GITHUB_ENV"
          else
            echo "ENGINE_VERSION=$(awk -F'\"' '/^version = / {print $2; exit}' pyproject.toml)" >> "$GITHUB_ENV"
          fi

      - name: Log in to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          push: true
          labels: |
            gitsha1=${{ github.sha }}
            org.opencontainers.image.version=${{ env.ENGINE_VERSION }}
          tags: |
            docker.io/${{ env.DOCKERHUB_IMAGE }}
          file: "docker/Dockerfile"
          platforms: ${{ matrix.platform }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: digests-${{ matrix.suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Push merged image tags to Docker Hub
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          image="${owner}/engine"
          if [[ -n "${{ secrets.DOCKERHUB_REPOSITORY }}" ]]; then
            image="${{ secrets.DOCKERHUB_REPOSITORY }}"
          fi
          echo "name=${image}" >> "$GITHUB_OUTPUT"

      - name: Log in to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Calculate Docker image tags
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: docker.io/${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          REPOSITORY: docker.io/${{ steps.image.outputs.name }}
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$REPOSITORY@sha256:%s " *)
